# Watches upstream Emby releases and proposes a bump before the pinned version
# is pruned. Emby deletes old 4.10.x pre-releases on a short rolling window, so
# a static pin eventually 404s and breaks CI for reasons unrelated to this repo.
#
# PRs are opened by the segrep-emby-bump GitHub App, not GITHUB_TOKEN: GitHub
# suppresses workflow runs for events raised by the default token, so a PR it
# created would receive no CI at all.

name: Emby version watch

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EMBY_BUMP_APP_ID }}
          private-key: ${{ secrets.EMBY_BUMP_APP_KEY }}
          # Without these the token inherits every permission the App
          # installation holds. Request the three this job actually uses:
          # contents to push the branch, pull-requests to open the PR,
          # issues to file the urgent tracking issue.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Check pinned Emby version
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/emby-version-check.mjs

      - name: Open or update bump PR
        if: steps.check.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STATUS: ${{ steps.check.outputs.status }}
          TARGET: ${{ steps.check.outputs.target }}
          PINNED: ${{ steps.check.outputs.pinned }}
          REASON: ${{ steps.check.outputs.reason }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$TARGET" ]; then
            echo "::error::No surviving release in the pinned line. This needs a human: the whole line may have been pruned or retired."
            exit 1
          fi

          branch="chore/emby-version-${TARGET}"

          # Idempotency: this runs weekly against a mostly unchanged situation,
          # so an existing PR for this target is updated, never duplicated.
          existing=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $TARGET; nothing to do."
            exit 0
          fi

          # The branch and commit are created through the REST Contents API
          # rather than git push, because main requires signed commits (see the
          # "Protect main" ruleset). A commit made by `git commit` on a runner
          # is unsigned - the App token authenticates the push, not the commit
          # object - so the PR opened fine and was then unmergeable (#180).
          # Squash-only merging does not rescue this: required_signatures is
          # evaluated against the branch's own commits, not the squash result,
          # so #180 stayed BLOCKED with every check green and the branch current.
          #
          # GitHub signs a commit it creates through the API only when the
          # caller is an App installation token or the web flow; the same call
          # made with a PAT is left unsigned, so this depends on GH_TOKEN being
          # the minted App token above. This is also why dependabot's commits
          # in this repo show committer "GitHub" and verified: true.
          #
          # Do not swap this for the low-level Git Data API (POST /git/commits):
          # that writes the commit object verbatim and does not sign it.
          default_branch=$(gh api "repos/${REPO}" --jq '.default_branch')
          base_sha=$(gh api "repos/${REPO}/git/ref/heads/${default_branch}" --jq '.object.sha')

          # A branch can survive a closed-without-merge PR. Reset it to the
          # current base so the bump lands on today's main, not a stale tip.
          if gh api "repos/${REPO}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            # -f keeps sha a string; -F would coerce a value that parses as a
            # number, so the two flags are not interchangeable here.
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${branch}" \
              -f sha="$base_sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${branch}" -f sha="$base_sha" >/dev/null
          fi

          file_sha=$(gh api "repos/${REPO}/contents/.emby-version?ref=${base_sha}" --jq '.sha')
          content=$(printf '%s\n' "$TARGET" | base64 -w0)

          # Built with printf rather than an inline heredoc-style string: a
          # literal newline inside the -f value would carry this block's YAML
          # indentation into the commit message body.
          message=$(printf 'ci: bump pinned Emby version to %s\n\n%s\n' "$TARGET" "$REASON")

          gh api -X PUT "repos/${REPO}/contents/.emby-version" \
            -f message="$message" \
            -f content="$content" \
            -f branch="$branch" \
            -f sha="$file_sha" >/dev/null

          body_file="$(mktemp)"
          {
            printf '## Summary\n\n'
            printf -- '- %s\n' "$REASON"
            # shellcheck disable=SC2016 # backticks below are literal Markdown code formatting, not command substitution
            printf -- '- Moves the pinned Emby reference-assembly version from `%s` to `%s`.\n\n' "$PINNED" "$TARGET"
            printf '## Why this is automated\n\n'
            # shellcheck disable=SC2016 # backticks below are literal Markdown code formatting, not command substitution
            printf 'Emby prunes old pre-releases from `MediaBrowser/Emby.Releases`, so a static pin eventually 404s and breaks CI for reasons unrelated to any change here. See #165.\n\n'
            printf '## Review guidance\n\n'
            printf 'The diff is one line. What matters is whether CI passes: a green build proves the 4.10 ABI still compiles against the new reference assemblies.\n'
          } > "$body_file"

          labels="ci,dependencies"
          if [ "$STATUS" = "urgent" ]; then
            labels="$labels,emby-pin-urgent"
          fi

          gh pr create --repo "$REPO" \
            --head "$branch" \
            --title "ci: bump pinned Emby version to ${TARGET}" \
            --label "$labels" \
            --body-file "$body_file"
          rm -f "$body_file"

      - name: Open or update urgent tracking issue
        if: steps.check.outputs.status == 'urgent'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ steps.check.outputs.target }}
          PINNED: ${{ steps.check.outputs.pinned }}
          REASON: ${{ steps.check.outputs.reason }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Emby pin ${PINNED} has been deleted upstream"

          # One reused issue, re-commented. A new issue per weekly run would bury
          # the signal it exists to raise.
          existing=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still broken as of this run. ${REASON}"
            exit 0
          fi

          gh issue create --repo "$REPO" \
            --title "$title" \
            --label "bug,ci,emby-pin-urgent" \
            --body "${REASON}

          CI is failing until the pin moves to \`${TARGET}\`. A bump PR has been opened and will merge automatically once all checks pass.

          Tracking: #165"
